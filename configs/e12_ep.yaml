# E12 Q4 (docs/PLANS.md (lacs_e12_plan_20261029) section 8): the geo-e2 pipeline on the European Parliament data built
# by python -m e12.build (positions = MDS dim1 as (x, 0, 0); tolerances from training retweets; graph =
# training retweets; outcome = a retweet between the two MEPs in the test period). Units are MDS units even
# where a column is called *_km. Also the source of the groups of Q2 and Q3
# (python -m p0kit.export_groups geo --config configs/e12_ep.yaml --out runs/e12/e1_input).
name: e12
out_dir: runs/e12
seed: 20261029
geo:
  tolerance_fixed: theta_q50
  alt_outcomes: [notop, newpairs]   # plan section 3.5 robustness versions (report only)
  queries: all
  methods: [lcc_exact, lcc_greedy, lcc_ballcore_f, lcc_ballcore_r, pairwise, kcore, kr_global, kr_tau, sac,
            sac_sized, edgeacc, random_bfs]
  member_analysis: [sac, kr_global, kr_tau]
  abstention: [sac, kr_global]
  g3_k: [2, 3, 4, 5]
  g3_queries: 200
  e2_sweep_k: [2, 3, 4, 5]
  e2_sweep_k_queries: all
  e2_sweep_tolerances: [theta_q50, theta_q70, theta_q90]
  sweep_tolerance_queries: 100000   # = all eligible queries
  engine_block: 0
gates: {g3_min_median: 5}
search:
  k: 3
  n_queries: 2000
  time_limit: 60
  n_proc: 2
